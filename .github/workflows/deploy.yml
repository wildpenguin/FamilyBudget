# .github/workflows/deploy.yml
name: Build and Deploy

on:
  push:
    branches: [main]

env:
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/budget-backend

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU (for ARM cross-build)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image (linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: ./apps/backend
          push: true
          platforms: linux/arm64
          tags: ${{ env.BACKEND_IMAGE }}:latest

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build frontend web export
        run: |
          npm ci
          npm run build:web --workspace=@ourbudget/mobile

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: apps/mobile/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend-dist

      - name: Copy frontend build to the VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}  
          key: ${{ secrets.VM_SSH_KEY }}
          source: "frontend-dist/*"
          target: "~/budget-app/apps/mobile/dist"
          strip_components: 1

      - name: Pull latest backend image and restart stack
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            cd ~/budget-app
            docker compose pull backend
            docker compose up -d